<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Royal Golden Wax Seal Gradient -->
    <radialGradient id="gold-seal" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#fff5d6" />
      <stop offset="30%" stop-color="#e8cd8b" />
      <stop offset="60%" stop-color="#d4af5a" />
      <stop offset="85%" stop-color="#997222" />
      <stop offset="100%" stop-color="#5c420e" />
    </radialGradient>
    <!-- Soft Outer Drop Shadow -->
    <filter id="seal-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#020d09" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Wax Seal Circular Medallion -->
  <circle cx="32" cy="32" r="29" fill="url(#gold-seal)" filter="url(#seal-shadow)" stroke="#4a300a" stroke-width="1.2" />

  <!-- Concentric Inner Dashed Stitched Ring -->
  <circle cx="32" cy="32" r="25" stroke="#fff5d6" stroke-width="0.8" stroke-dasharray="2 2.5" opacity="0.9" fill="none" />
  <circle cx="32" cy="32" r="23" stroke="#4a300a" stroke-width="0.5" opacity="0.6" fill="none" />

  <!-- Subtle 3D Debossed Light Shadow -->
  <g transform="translate(0, 0.8)" opacity="0.45">
    <text x="20.5" y="32.5" text-anchor="middle" dominant-baseline="central" font-family="'Bodoni Moda', 'Cormorant Garamond', Georgia, serif" font-size="18" font-weight="700" fill="#fff5d6">S</text>
    <text x="31" y="30.5" text-anchor="middle" dominant-baseline="central" font-family="'Great Vibes', cursive, serif" font-size="15" font-weight="normal" fill="#fff5d6">&amp;</text>
    <text x="42.5" y="32.5" text-anchor="middle" dominant-baseline="central" font-family="'Bodoni Moda', 'Cormorant Garamond', Georgia, serif" font-size="18" font-weight="700" fill="#fff5d6">M</text>
  </g>

  <!-- Deep Bronze Stamped Monogram -->
  <g>
    <text x="20.5" y="32" text-anchor="middle" dominant-baseline="central" font-family="'Bodoni Moda', 'Cormorant Garamond', Georgia, serif" font-size="18" font-weight="700" fill="#241001">S</text>
    <text x="31" y="30" text-anchor="middle" dominant-baseline="central" font-family="'Great Vibes', cursive, serif" font-size="15" font-weight="normal" fill="#4a2908">&amp;</text>
    <text x="42.5" y="32" text-anchor="middle" dominant-baseline="central" font-family="'Bodoni Moda', 'Cormorant Garamond', Georgia, serif" font-size="18" font-weight="700" fill="#241001">M</text>
  </g>
</svg>
