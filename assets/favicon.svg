<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Deep Royal Emerald Jewel Background -->
    <radialGradient id="emerald-bg" cx="35%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#0E4A39" />
      <stop offset="55%" stop-color="#06291E" />
      <stop offset="100%" stop-color="#031610" />
    </radialGradient>

    <!-- Brushed Champagne Gold Foil -->
    <linearGradient id="gold-foil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="30%" stop-color="#EBD08E" />
      <stop offset="65%" stop-color="#CFA44E" />
      <stop offset="100%" stop-color="#9A7220" />
